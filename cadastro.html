<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>Criar Conta</h2>

        <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" placeholder="Digite seu nome">
        </div>

        <div class="form-group">
            <label for="nascimento">Data de nascimento</label>
            <input type="date" id="nascimento">
        </div>

        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail">
        </div>

        <div class="form-group">
            <label for="usuarioCad">Usuário</label>
            <input type="text" id="usuarioCad" placeholder="Crie um usuário">
        </div>

        <div class="form-group">
            <label for="senhaCad">Senha</label>
            <input type="password" id="senhaCad" placeholder="Crie uma senha">
        </div>

        <div class="form-group">
            <label for="confirmaSenha">Confirmar Senha</label>
            <input type="password" id="confirmaSenha" placeholder="Confirme sua senha">
        </div>

        <button type="button" class="btn-principal" id="btnCadastrar">Criar Conta</button>
        
        <a href="index.html" class="btn-secundario">Já tenho conta</a>

        <div class="mensagem" id="mensagemFeedback"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
